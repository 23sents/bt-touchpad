name: Release

on:
  push:
    tags:
      - 'linux-v*'
      - 'android-v*'

permissions:
  contents: write

jobs:
  linux:
    if: startsWith(github.ref_name, 'linux-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare asset
        run: cp linux/server.py bt-touchpad-server.py
      - uses: softprops/action-gh-release@v2
        with:
          files: bt-touchpad-server.py
          generate_release_notes: true

  android:
    if: startsWith(github.ref_name, 'android-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Prepare asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bt-touchpad.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: bt-touchpad.apk
          generate_release_notes: true
